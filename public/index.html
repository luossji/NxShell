<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <style>
      /* 首屏加载占位：主进程在 production 下窗口创建即可见，这里让等待期不是白屏 */
      html, body { margin: 0; padding: 0; height: 100%; background-color: #ffffff; }
      #app { height: 100%; }
      .nx-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 18px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .nx-splash__title {
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 2px;
        color: #303133;
        opacity: .85;
      }
      .nx-splash__bar {
        position: relative;
        width: 140px;
        height: 3px;
        border-radius: 3px;
        background-color: rgba(64, 158, 255, .16);
        overflow: hidden;
      }
      .nx-splash__bar::after {
        content: "";
        position: absolute;
        top: 0;
        left: -40%;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background-color: #409eff;
        animation: nx-splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes nx-splash-slide {
        0% { left: -40%; }
        100% { left: 100%; }
      }
    </style>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but <%= htmlWebpackPlugin.options.title %> doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app">
      <div class="nx-splash">
        <div class="nx-splash__title">NxShell</div>
        <div class="nx-splash__bar"></div>
      </div>
    </div>
    <!-- built files will be auto injected -->
  </body>
</html>
